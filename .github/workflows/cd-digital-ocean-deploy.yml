name: CD - Deploy Backend to DigitalOcean

on:
  workflow_run:
    workflows: ["Backend tests CI"]
    types:
      - completed
    branches:
      - main
      - 'release/*.*.*'

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar con Maven
        run: ./mvnw clean package -DskipTests

      - name: Preparar archivos para el despliegue
        run: |
          mkdir -p deploy-bundle
          # Copiamos el jar y le damos un nombre genérico para facilitar el Dockerfile
          cp target/*.jar deploy-bundle/app.jar
          cp Dockerfile deploy-bundle/

      - name: Enviar archivos al Droplet vía SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "backend/deploy-bundle/*"
          target: "/opt/mi-backend"
          strip_components: 2

      - name: Desplegar nueva versión en Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/mi-backend
            
            # Construye la nueva imagen
            docker build -t mi-backend .
            
            # Detiene y borra el contenedor viejo
            docker stop spring-app || true
            docker rm spring-app || true
            
            # Levanta el nuevo contenedor
            docker run -d -p 8080:8080 --name spring-app --restart unless-stopped mi-backend
            
            # Limpieza
            docker image prune -f