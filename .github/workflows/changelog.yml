name: Changelog CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - CHANGELOG.md
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout código completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar changelog con git-cliff
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit y push del CHANGELOG.md
        if: github.event_name == 'push' || github.event_name == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(changelog): actualizar para ${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Adjuntar changelog a la GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
