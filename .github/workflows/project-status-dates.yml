name: Registrar fechas de transición en ProjectV2

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

on:
  workflow_dispatch:
  issues:
    types: [edited, labeled, unlabeled]

jobs:
  update-dates:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Obtener item del ProjectV2 asociado a la issue
        id: item
        run: |
          gh api graphql -f query='
            query($owner:String!, $repo:String!, $issue:Int!) {
              repository(owner:$owner, name:$repo) {
                issue(number:$issue) {
                  projectItems(first:20) {
                    nodes {
                      id
                      project { id }
                      fieldValues(first:20) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            field { name }
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            -f issue="${{ github.event.issue.number }}" > item.json

          ITEM_ID=$(jq -r '.data.repository.issue.projectItems.nodes[0].id' item.json)
          PROJECT_ID=$(jq -r '.data.repository.issue.projectItems.nodes[0].project.id' item.json)
          STATUS=$(jq -r '.data.repository.issue.projectItems.nodes[0].fieldValues.nodes[]? | select(.field.name=="Status") | .name' item.json)

          echo "ITEM_ID=$ITEM_ID" >> $GITHUB_ENV
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV
          echo "STATUS=$STATUS" >> $GITHUB_ENV

      - name: Registrar fecha
        if: env.STATUS != ''
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "$STATUS" = "Todo" ]; then FIELD_NAME="TODO At"; fi
          if [ "$STATUS" = "In Progress" ]; then FIELD_NAME="In Progress At"; fi
          if [ "$STATUS" = "In Review" ]; then FIELD_NAME="In Review At"; fi
          if [ "$STATUS" = "Done" ]; then FIELD_NAME="Done At"; fi

          echo "Campo detectado: $FIELD_NAME"

          gh api graphql -f query='
            query($project:ID!) {
              node(id:$project) {
                ... on ProjectV2 {
                  fields(first:50) {
                    nodes { id name }
                  }
                }
              }
            }' \
            -f project="$PROJECT_ID" > fields.json

          FIELD_ID=$(jq -r --arg NAME "$FIELD_NAME" '.data.node.fields.nodes[] | select(.name==$NAME) | .id' fields.json)

          echo "FIELD_ID=$FIELD_ID"

          gh api graphql -f query='
            mutation($item:ID!, $field:ID!, $value:String!) {
              updateProjectV2ItemFieldValue(
                input: {
                  itemId: $item,
                  fieldId: $field,
                  value: { date: $value }
                }
              ) {
                projectV2Item { id }
              }
            }' \
            -f item="$ITEM_ID" \
            -f field="$FIELD_ID" \
            -f value="$DATE"
