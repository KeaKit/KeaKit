name: Actualizar fechas del GitHub Project

on:
  schedule:
    - cron: "0 0,2,10,12,14,17,19,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  update-dates:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v3
      
      - name: Instalar dependencias de Python
        run: |
          pip install requests  # Solo esto es necesario
      
      - name: Verificar que el script existe
        run: |
          if [ ! -f "scripts/update-github-project-dates.sh" ]; then
            echo "Script no encontrado en scripts/update-github-project-dates.sh"
            exit 1
          fi
          chmod +x scripts/update-github-project-dates.sh
      
      - name: Ejecutar script de actualización de fechas
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROJECT_ID: "PVT_kwDOD3Si084BPCwq"
          REPO_OWNER: "KeaKit"
          REPO_NAME: "KeaKit"
          MILESTONE_NUMBER: "3"  # Milestone que va a recorrer (S2)
        run: |
          echo "Ejecutando script para milestone 3..."
          ./scripts/update-github-project-dates.sh
      
      - name: Notificar resultado
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "Script ejecutado correctamente"
          else
            echo "Error al ejecutar el script"
            exit 1
          fi