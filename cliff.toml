[changelog]
header = "# Changelog\n\n"
body = """
## {{ version | default(value="Unreleased") }} — {{ timestamp | date(format="%d/%m/%Y") }}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true

commit_parsers = [
  { message = "^feat", group = "Novedades" },
  { message = "^fix", group = "Correcciones" },
  { message = "^perf", group = "Mejoras de rendimiento" },
  { message = "^refactor", group = "Refactorizaciones" },
  { message = "^breaking", group = "Cambios incompatibles" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^docs", skip = true }
]
