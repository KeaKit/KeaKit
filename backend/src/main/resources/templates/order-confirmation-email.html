<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmación de pedido</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
  <h2>¡Pedido confirmado!</h2>
  <p>Hola {{tenantName}},</p>
  <p>Tu pedido ha sido confirmado correctamente.</p>
  <ul>
    <li><strong>ID del pedido:</strong> {{kitId}}</li>
    <li><strong>Nombre del kit:</strong> {{kitName}}</li>
    <li><strong>Destino:</strong> {{kitCity}}, {{kitCountry}}</li>
    <li><strong>Fechas:</strong> {{kitStartDate}} - {{kitEndDate}}</li>
  </ul>
  <p>Gracias por confiar en KeaKit.</p>
</body>
</html>
