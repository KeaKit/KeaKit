spring:
  application:
    name: demo
  
  datasource:
    # 'postgres' matches the service name in your docker-compose.yml
    url: ${DB_URL:jdbc:postgresql://postgres:5432/appdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' automatically creates/updates tables based on your Java entities
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: KeaKitSecureSecretKey12345678901234567890ABCDEFGHIJKLMNOP
  expiration: 86400000

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:no-reply@keakit.app}